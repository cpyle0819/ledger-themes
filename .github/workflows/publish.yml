# Publish theme packages to npm via trusted publishing (OIDC) — no long-lived
# tokens. Triggered by pushing a tag like `the-ledger-v1.0.1` or
# `space-opera-v1.2.0`; the job publishes only the matching package.
#
# One-time setup per package (on npmjs.com, after the first manual publish):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: cpyle0819
#     Repository:           ledger-themes
#     Workflow filename:    publish.yml
# Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0 (satisfied by
# the setup-node version below), and each package's package.json `repository.url`
# must match this repo exactly (it does). Publishing from a public repo this way
# also produces provenance attestations automatically.
name: publish

on:
  push:
    tags:
      - 'the-ledger-v*'
      - 'space-opera-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC — this is what replaces the token
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm >= 11.5.1, but Node 22.14.0 bundles
      # npm 10.x — too old to detect the OIDC environment, so `npm publish` would
      # silently fall back to (absent) token auth and 404. Upgrade npm first.
      - run: npm install -g npm@latest

      # Pick the package from the tag prefix: `the-ledger-v*` → packages/the-ledger,
      # `space-opera-v*` → packages/space-opera.
      - name: Resolve package from tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            the-ledger-v*)  echo "dir=packages/the-ledger"  >> "$GITHUB_OUTPUT" ;;
            space-opera-v*) echo "dir=packages/space-opera" >> "$GITHUB_OUTPUT" ;;
            *) echo "Tag ${GITHUB_REF_NAME} matches no known package" >&2; exit 1 ;;
          esac

      - run: npm ci

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public
